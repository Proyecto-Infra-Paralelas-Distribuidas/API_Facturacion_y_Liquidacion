spring.application.name=facturacion-liquidacion
server.port=8080
server.shutdown=graceful
server.tomcat.threads.max=${TOMCAT_THREADS:20}

# Base de datos (se inyecta por configuración, no en el código)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/liquidacion}
spring.datasource.username=${DB_USER:liquidacion}
spring.datasource.password=${DB_PASSWORD:liquidacion}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000

# Esquema y datos de ejemplo del Avance 1
spring.sql.init.mode=always

spring.jackson.default-property-inclusion=non_null

# Parámetros del servicio
app.version=1.0.0
app.max-concurrent=${MAX_CONCURRENT_JOBS:2}
app.tarifa-por-kwh=${TARIFA_POR_KWH:450}
app.url-reportes=${URL_REPORTES:}
app.url-mantenimiento=${URL_MANTENIMIENTO:}
