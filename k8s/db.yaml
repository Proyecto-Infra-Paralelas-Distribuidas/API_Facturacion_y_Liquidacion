apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidacion-db
  labels:
    app: liquidacion-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidacion-db
  template:
    metadata:
      labels:
        app: liquidacion-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: liquidacion
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: liquidacion-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquidacion-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "liquidacion", "-d", "liquidacion"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: liquidacion-db
  labels:
    app: liquidacion-db
spec:
  type: ClusterIP
  selector:
    app: liquidacion-db
  ports:
    - port: 5432
      targetPort: 5432
