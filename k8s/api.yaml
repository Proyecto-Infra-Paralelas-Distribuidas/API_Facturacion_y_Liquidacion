# IMPORTANTE: cambia la imagen por la que subiste a tu registro (misma que usa EC2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidacion-api
  labels:
    app: liquidacion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liquidacion-api
  template:
    metadata:
      labels:
        app: liquidacion-api
    spec:
      containers:
        - name: api
          image: ghcr.io/proyecto-infra-paralelas-distribuidas/facturacion-liquidacion:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: liquidacion-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquidacion-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: liquidacion-api
  labels:
    app: liquidacion-api
spec:
  type: ClusterIP
  selector:
    app: liquidacion-api
  ports:
    - port: 8080
      targetPort: 8080
